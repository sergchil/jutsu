name: upstream pstack

# Every Monday, pull the latest pstack into vendor/, 3-way merge each override
# upstream touched, and open a pull request with the upstream commits and the
# merge result per file. The build on that branch fails until each merged
# override is reviewed and relocked, so nothing drifts silently.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sync vendor/pstack
        id: sync
        env:
          # lets the sync ask gh whether an upstream bug we patch is closed
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Upstream pstack changed. The sync 3-way merged each override upstream touched and lists every item to port."
            echo "Review each merged override and resolve each conflict on this branch, then run \`python3 tools/build.py --relock <plugin path>\` for it, and the tests (docs/UPDATING.md)."
            echo
            echo '```text'
            python3 tools/sync_upstream.py --summary "$RUNNER_TEMP/summary.md"
            echo '```'
            echo
            if [ -f "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md"; fi
          } > "$RUNNER_TEMP/sync.md"
          cat "$RUNNER_TEMP/sync.md"
          if git diff --quiet -- vendor port/upstream.json port/overrides; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: open the update pull request
        id: pr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream/pstack
          title: Upstream pstack update
          body-path: ${{ runner.temp }}/sync.md
          commit-message: "vendor: sync upstream pstack"
          add-paths: |
            vendor/**
            port/upstream.json
            port/overrides/**
      # GitHub does not start workflows for a pull request opened with GITHUB_TOKEN,
      # so the update PR would show no checks at all. A workflow_dispatch run is the
      # one event GITHUB_TOKEN may start; its check lands on the PR's head commit,
      # and stays red until every listed item is ported.
      - name: run ci on the update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref upstream/pstack
