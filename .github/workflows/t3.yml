name: upstream t3

# Every Monday, regenerate T3 Code's snapshot from its main branch: the MCP tool names
# (tools/t3-tools.txt) and the instruction files T3 puts in Claude's system prompt, plus
# the delegate_task schema (tools/t3-instructions.txt). When either changes, open a pull
# request with the diff. tools/check.py reads the tool list, so CI on that branch fails
# while the plugin names a tool T3 no longer has. An instruction change fails nothing;
# it means runtime.md may be wrong now, so re-probe what it touches (docs/UPDATING.md).
# No step reads event text, so nothing untrusted reaches a shell.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: regenerate the T3 snapshot
        id: sync
        run: |
          python3 tools/t3_tools.py --ref main > "$RUNNER_TEMP/out.txt"
          {
            echo "T3 Code changed what it tells Claude. Port every jutsu file listed next to a removed tool,"
            echo "check that each added tool needs no mention in runtime.md, and re-probe each runtime.md"
            echo "fact the instruction diff touches (docs/UPDATING.md, T3 updates)."
            echo
            echo '````diff'
            # A PR body holds at most 65536 characters. The full diff is in the commit.
            head -c 60000 "$RUNNER_TEMP/out.txt"
            echo
            echo '````'
          } > "$RUNNER_TEMP/t3.md"
          cat "$RUNNER_TEMP/out.txt"
          # The headers name the pin and move every week. t3_tools.py ignores them and
          # ends with `changed: yes` only when a tool name or an instruction line changed.
          if tail -n 1 "$RUNNER_TEMP/out.txt" | grep -qx 'changed: yes'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: open the update pull request
        id: pr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream/t3
          title: Upstream T3 tools or instructions changed
          body-path: ${{ runner.temp }}/t3.md
          commit-message: "t3: regenerate the T3 tool list and instruction snapshot from T3 main"
          add-paths: |
            tools/t3-tools.txt
            tools/t3-instructions.txt
            port/t3.json
      # A pull request opened with GITHUB_TOKEN starts no workflows, so dispatch CI
      # on the branch; its check lands on the PR's head commit (see upstream.yml).
      - name: run ci on the update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref upstream/t3
