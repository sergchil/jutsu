name: Idea
description: Suggest a way to make jutsu work better in Claude Code or T3 Code.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should jutsu do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
